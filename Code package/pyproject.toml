[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corona-rna"
version = "0.1.0"
description = "This package is used for analyzing and visualizing data of viral transcriptomes and interaction data."
readme = "README.md"
requires-python = ">=3.7"
authors = [
    {name = "WenZi0809", email = "619182681@qq.com"},
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "brokenaxes",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
urls = {Homepage = "https://github.com/WenZi0809/RNA-architecture-underlies-discontinuous-transcription-and-evolution-of-coronavirus"}

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], exclude = ["test*"]}}

[tool.setuptools.package-data]